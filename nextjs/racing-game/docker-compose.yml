version: '3.8'

services:
  racing-game:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_VERSION=${APP_VERSION:-v1.0.0}
      - NEXT_PUBLIC_ENVIRONMENT=${ENVIRONMENT:-production}
    restart: unless-stopped

  racing-game-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3001:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_ENVIRONMENT=development
    command: npm run dev
    restart: unless-stopped
